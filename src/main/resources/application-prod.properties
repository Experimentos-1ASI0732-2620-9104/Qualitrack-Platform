# Production profile

spring.datasource.url=jdbc:mysql://${DATABASE_URL}:${DATABASE_PORT:3306}/${DATABASE_NAME}?useSSL=true&serverTimezone=UTC&createDatabaseIfNotExist=false&publicKeyRetrieval=true

spring.datasource.username=${DATABASE_USER}

spring.datasource.password=${DATABASE_PASSWORD}

# Production-lean JPA behavior
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# App port
server.port=${PORT:8080}
server.address=0.0.0.0

# JWT secret
authorization.jwt.secret=${JWT_SECRET}

stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# Web front (Firebase Hosting): credentials e-mail link, Stripe return URLs and CORS.
# APPLICATION_FRONTEND_URL and APPLICATION_CORS_ALLOWED_ORIGINS override them.
application.frontend-url=${APPLICATION_FRONTEND_URL:https://qualitrack-iotech.web.app}
application.cors.allowed-origins=${APPLICATION_CORS_ALLOWED_ORIGINS:https://qualitrack-iotech.web.app,https://qualitrack-iotech.firebaseapp.com}
