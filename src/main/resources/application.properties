# Spring Application Name
spring.application.name=Qualitrack Platform

# Default profile
spring.profiles.default=dev

# Shared Spring DataSource Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Shared Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.naming.physical-strategy=com.iotech.qualitrack.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Application Information for Documentation
documentation.application.title=Qualitrack API
documentation.application.description=Qualitrack Platform REST API Documentation
documentation.application.version=1.0.0

# JWT Configuration Properties
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=7

# i18n message bundles
spring.messages.basename=messages
spring.messages.encoding=UTF-8

stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Stripe prices of the subscription plans created at startup when the database does not have them (prices of the
# Stripe test account by default). Set the STRIPE_PRICE_* variables when another Stripe account is used.
subscription.plans.stripe-prices.basic-monthly=${STRIPE_PRICE_BASIC_MONTHLY:price_1Thxhn1OZXy8dxEFGbIobJvw}
subscription.plans.stripe-prices.basic-yearly=${STRIPE_PRICE_BASIC_YEARLY:price_1Ti1eb1OZXy8dxEFRKk8EvB4}
subscription.plans.stripe-prices.enterprise-monthly=${STRIPE_PRICE_ENTERPRISE_MONTHLY:price_1Ti1h51OZXy8dxEFb1nz3C9N}
subscription.plans.stripe-prices.enterprise-yearly=${STRIPE_PRICE_ENTERPRISE_YEARLY:price_1Ti1hY1OZXy8dxEFrX23COMm}

# Transactional e-mails (staff credentials, password recovery codes and critical alert notices). With RESEND_API_KEY they are sent by the
# Resend API over HTTPS (works where SMTP ports are blocked, e.g. Render); without a verified domain Resend only accepts
# the sender onboarding@resend.dev and delivers only to the address of the Resend account. Without RESEND_API_KEY they
# are sent by SMTP: set SPRING_MAIL_HOST (e.g. smtp.gmail.com), SPRING_MAIL_PORT (587), SPRING_MAIL_USERNAME (the
# sending account) and SPRING_MAIL_PASSWORD (for Gmail, an app password). QUALITRACK_MAIL_FROM sets the sender (e.g.
# "QualiTrack <account@gmail.com>"). Without a provider nothing is sent: the temporary password of a staff member is
# shown once to the quality manager, and recovery codes are not delivered. The timeouts keep requests from waiting on
# a blocked SMTP port.
qualitrack.mail.resend.api-key=${RESEND_API_KEY:}
qualitrack.mail.resend.base-url=${RESEND_BASE_URL:https://api.resend.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
qualitrack.mail.from=${QUALITRACK_MAIL_FROM:}
# Sign-in link of the credentials e-mail; by default the web front of APPLICATION_FRONTEND_URL.
qualitrack.web.sign-in-url=${QUALITRACK_WEB_SIGN_IN_URL:${application.frontend-url:http://localhost:4200}/iam/sign-in}
